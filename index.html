<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Silkey's Mobile Oil</title>
<style>
:root{--bg:#090b0e;--panel:#12161b;--line:#2a3139;--text:#f7f7f7;--muted:#a9b1bb;--red:#e5482e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
.app{max-width:760px;margin:auto;padding-bottom:80px}
.top{text-align:center;padding:22px 16px 12px}
.logo{font-size:28px;font-weight:800}
.tag{color:#bbb;margin-top:4px}
.contact{font-size:13px;color:#999;margin-top:5px}
.contact a{color:#69a9ff}
.page{padding:10px 16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
.hero{background:linear-gradient(145deg,#191e24,#101317)}
.hero h1{font-size:32px;margin:0 0 10px}
.hero p,.small{color:var(--muted);line-height:1.5}
button,.btn{font:inherit;border:1px solid var(--line);background:#1a2026;color:white;border-radius:12px;padding:12px 15px;font-weight:700}
.primary{background:var(--red);border-color:var(--red)}
.actions{display:flex;gap:9px;flex-wrap:wrap}
.actions>*{flex:1;min-width:120px}
.field{margin-bottom:14px}
.field label{display:block;color:#cbd0d5;font-size:13px;margin-bottom:6px}
input,select,textarea{width:100%;background:#0c1014;color:white;border:1px solid #303841;border-radius:11px;padding:12px}
textarea{min-height:100px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
.steps{display:flex;gap:6px;margin-bottom:16px}
.step{height:5px;flex:1;background:#292f35;border-radius:20px}
.step.on{background:var(--red)}
.service{display:block;width:100%;text-align:left;margin-bottom:9px;background:#10151a}
.service.selected{border-color:var(--red);box-shadow:0 0 0 1px var(--red) inset}
.service b{float:right}
.row{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.metricgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.metric{background:#181d23;border:1px solid var(--line);border-radius:14px;padding:14px}
.metric strong{font-size:25px;display:block;margin-top:4px}
.status{font-size:12px;background:#30363d;border-radius:20px;padding:5px 9px}
.item{padding:14px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);background:#0d1014;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:8px;z-index:5}
.bottom button{border:0;background:none;color:#aaa;padding:6px 2px;font-size:11px}
.bottom button span{display:block;font-size:20px}
.bottom .active{color:white}
.bottom .active span{color:#ff5a3d}
.hidden{display:none}
.success{background:#102119;border:1px solid #285c3c;border-radius:16px;padding:18px}
</style>
</head>

<body>
<div class="app">

<header class="top">
<div class="logo">Silkey's Mobile Oil</div>
<div class="tag">Oil Change. We Come To You.</div>
<div class="contact">Muskogee, Oklahoma & surrounding areas • <a href="tel:5802226601">580-222-6601</a></div>
</header>

<main id="screen" class="page"></main>

<nav id="bottom" class="bottom">
<button onclick="owner('home')" id="bhome"><span>⌂</span>Home</button>
<button onclick="owner('appointments')" id="bappointments"><span>▣</span>Appointments</button>
<button onclick="owner('customers')" id="bcustomers"><span>♙</span>Customers</button>
<button onclick="owner('money')" id="bmoney"><span>$</span>Money</button>
<button onclick="owner('more')" id="bmore"><span>•••</span>More</button>
</nav>

</div>

<script>

const KEY="silkeysMobileOil";

let data=JSON.parse(localStorage.getItem(KEY)||"null")||{
appointments:[],
customers:[],
payments:[],
expenses:[]
};

let step=1;

let book={
name:"",
phone:"",
year:"",
make:"",
model:"",
engine:"",
service:"",
address:"",
date:"",
time:"",
payment:"Cash",
notes:""
};

const screen=document.getElementById("screen");
const bottom=document.getElementById("bottom");

function save(){
localStorage.setItem(KEY,JSON.stringify(data));
}

function esc(x){
return String(x||"").replace(/[&<>"']/g,c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[c]));
}

function money(x){
return "$"+Number(x||0).toFixed(2);
}

function home(){

bottom.classList.add("hidden");

screen.innerHTML=`

<section class="card hero">

<h1>Oil Change. We Come To You.</h1>

<p>
Mobile oil-change service at your home, work, or another convenient location.
</p>

<div class="actions">

<button class="primary" onclick="start()">
Book My Oil Change
</button>

<a class="btn" href="tel:5802226601"
style="text-align:center;text-decoration:none">
Call 580-222-6601
</a>

</div>

</section>

<section class="card">

<h2>Service Area</h2>

<p class="small">
Muskogee, Fort Gibson, Wagoner, Warner, Braggs, Okay, Oktaha,
Taft, Haskell, Webbers Falls, Porter and surrounding areas.
</p>

</section>

<section class="card">

<h2>Pricing</h2>

<div class="row"><span>Conventional — up to 5 qt</span><b>$105</b></div>
<div class="row"><span>Full Synthetic ⭐ — up to 5 qt</span><b>$120</b></div>
<div class="row"><span>Truck/SUV Full Synthetic — up to 6 qt</span><b>$140</b></div>
<div class="row"><span>Large Truck/SUV — up to 8 qt</span><b>$150+</b></div>
<div class="row"><span>Diesel</span><b>$175+</b></div>
<div class="row"><span>Additional oil</span><b>$10/qt</b></div>

</section>

<section class="card">
<h2>Payment</h2>
<p class="small">Cash • Check • Cash App ($KyleSilkey)</p>
</section>

`;

}

function start(){

book={
name:"",
phone:"",
year:"",
make:"",
model:"",
engine:"",
service:"",
address:"",
date:"",
time:"",
payment:"Cash",
notes:""
};

step=1;

customer();

}

function customer(){

bottom.classList.add("hidden");

let body="";

if(step===1){

body=`

<div class="field">
<label>Name</label>
<input id="name" value="${esc(book.name)}">
</div>

<div class="field">
<label>Phone</label>
<input id="phone" type="tel" value="${esc(book.phone)}">
</div>

`;

}

if(step===2){

body=`

<div class="grid">

<div class="field">
<label>Year</label>
<input id="year" value="${esc(book.year)}">
</div>

<div class="field">
<label>Make</label>
<input id="make" value="${esc(book.make)}">
</div>

<div class="field">
<label>Model</label>
<input id="model" value="${esc(book.model)}">
</div>

<div class="field">
<label>Engine</label>
<input id="engine" placeholder="Example: 5.3L" value="${esc(book.engine)}">
</div>

</div>

`;

}

if(step===3){

body=service("Conventional — up to 5 qt","$105");
body+=service("Full Synthetic — up to 5 qt","$120");
body+=service("Truck/SUV Full Synthetic — up to 6 qt","$140");
body+=service("Large Truck/SUV — up to 8 qt","$150+");
body+=service("Diesel — $175+","$175+");

}

if(step===4){

body=`

<div class="field">
<label>Service Address</label>
<input id="address" value="${esc(book.address)}">
</div>

<div class="grid">

<div class="field">
<label>Date</label>
<input id="date" type="date" value="${esc(book.date)}">
</div>

<div class="field">

<label>Time</label>

<select id="time">

<option value="">Choose</option>
<option>5:00 PM</option>
<option>6:00 PM</option>
<option>7:00 PM</option>
<option>8:00 PM</option>
<option>9:00 PM</option>
<option>Sunday — call/text</option>

</select>

</div>

</div>

<p class="small">
Monday–Thursday 5–9 PM. Sunday all day.
Friday/Saturday closed.
</p>

`;

}

if(step===5){

body=`

<div class="field">

<label>Payment</label>

<select id="payment">

<option>Cash</option>
<option>Check</option>
<option>Cash App ($KyleSilkey)</option>

</select>

</div>

<div class="field">

<label>Notes</label>

<textarea id="notes">${esc(book.notes)}</textarea>

</div>

`;

}

if(step===6){

body=`

${summary("Name",book.name)}
${summary("Phone",book.phone)}
${summary("Vehicle",book.year+" "+book.make+" "+book.model)}
${summary("Engine",book.engine||"Not provided")}
${summary("Service",book.service)}
${summary("Address",book.address)}
${summary("Date",book.date)}
${summary("Time",book.time)}
${summary("Payment",book.payment)}
${summary("Notes",book.notes||"None")}

`;

}

screen.innerHTML=`

<section class="card">

<div class="steps">

${[1,2,3,4,5,6].map(x=>
`<div class="step ${x<=step?"on":""}"></div>`
).join("")}

</div>

<h2>${[
"Customer Information",
"Vehicle",
"Service",
"Location & Date/Time",
"Payment & Notes",
"Review & Confirm"
][step-1]}</h2>

${body}

<div class="actions">

<button onclick="${step===1?"home()":"back()"}">
${step===1?"Cancel":"Back"}
</button>

<button class="primary"
onclick="${step===6?"submit()":"next()"}">
${step===6?"Confirm Booking":"Next"}
</button>

</div>

</section>

`;

}

function service(name,price){

return `

<button
class="service ${book.service===name?"selected":""}"
onclick="choose('${name.replace(/'/g,"\\'")}')">

${name}

<b>${price}</b>

</button>

`;

}

function choose(x){

book.service=x;

customer();

}

function summary(a,b){

return `<div class="row"><span>${a}</span><b>${esc(b)}</b></div>`;

}

function next(){

if(step===1){

book.name=document.getElementById("name").value.trim();
book.phone=document.getElementById("phone").value.trim();

if(!book.name||!book.phone){
alert("Please enter your name and phone.");
return;
}

}

if(step===2){

book.year=document.getElementById("year").value.trim();
book.make=document.getElementById("make").value.trim();
book.model=document.getElementById("model").value.trim();
book.engine=document.getElementById("engine").value.trim();

if(!book.year||!book.make||!book.model){
alert("Please enter the year, make and model.");
return;
}

}

if(step===3){

if(!book.service){
alert("Please choose a service.");
return;
}

}

if(step===4){

book.address=document.getElementById("address").value.trim();
book.date=document.getElementById("date").value;
book.time=document.getElementById("time").value;

if(!book.address||!book.date||!book.time){
alert("Please enter the address, date and time.");
return;
}

}

if(step===5){

book.payment=document.getElementById("payment").value;
book.notes=document.getElementById("notes").value.trim();

}

step++;

customer();

}

function back(){

step--;

customer();

}

function submit(){

let appointment={
id:Date.now(),
...book,
status:"Scheduled"
};

data.appointments.push(appointment);

let customer=data.customers.find(x=>x.phone===book.phone);

if(!customer){

customer={
id:Date.now()+1,
name:book.name,
phone:book.phone,
address:book.address,
vehicles:[],
history:[]
};

data.customers.push(customer);

}

customer.vehicles.push({
year:book.year,
make:book.make,
model:book.model,
engine:book.engine
});

customer.history.push({
date:book.date,
service:book.service,
status:"Scheduled"
});

save();

screen.innerHTML=`

<section class="success">

<h2>Booking Confirmed</h2>

<p>
Thanks, ${esc(book.name)}.
Your request has been saved.
</p>

${summary("Date",book.date)}
${summary("Time",book.time)}
${summary("Vehicle",book.year+" "+book.make+" "+book.model)}
${summary("Service",book.service)}

<div class="actions" style="margin-top:15px">

<button class="primary" onclick="home()">
Back Home
</button>

</div>

</section>

`;

}

function owner(page){

bottom.classList.remove("hidden");

bottom.querySelectorAll("button").forEach(x=>
x.classList.remove("active")
);

document.getElementById("b"+page).classList.add("active");

if(page==="home")ownerHome();
if(page==="appointments")appointments();
if(page==="customers")customers();
if(page==="money")moneyPage();
if(page==="more")more();

}

function ownerHome(){

screen.innerHTML=`

<section class="card">

<h2>Owner Home</h2>

<p class="small">
Overview of your mobile oil-change business.
</p>

</section>

<section class="metricgrid">

<div class="metric">
<span class="small">Appointments</span>
<strong>${data.appointments.length}</strong>
</div>

<div class="metric">
<span class="small">Scheduled</span>
<strong>${data.appointments.filter(x=>x.status==="Scheduled").length}</strong>
</div>

<div class="metric">
<span class="small">Customers</span>
<strong>${data.customers.length}</strong>
</div>

<div class="metric">
<span class="small">Collected</span>
<strong>${money(data.payments.reduce((a,x)=>a+Number(x.amount),0))}</strong>
</div>

</section>

<section class="card">

<h3>Quick Actions</h3>

<button class="primary"
onclick="start()">
+ New Appointment
</button>

</section>

`;

}

function appointments(){

screen.innerHTML=`

<section class="card">

<h2>Appointments</h2>

<p class="small">
Manage scheduled jobs and update job status.
</p>

</section>

<section class="card">

${
data.appointments.length

?

data.appointments.map(a=>`

<div class="item">

<div style="display:flex;justify-content:space-between">

<b>${esc(a.name)}</b>

<span class="status">
${esc(a.status)}
</span>

</div>

<p class="small">
${esc(a.date)} • ${esc(a.time)}
</p>

<p class="small">
${esc(a.year)} ${esc(a.make)} ${esc(a.model)}
</p>

<p class="small">
${esc(a.service)}
</p>

<p class="small">
${esc(a.address)}
</p>

<div class="actions">

<button onclick="status(${a.id},'On the Way')">
On the Way
</button>

<button onclick="status(${a.id},'Working')">
Working
</button>

<button onclick="status(${a.id},'Completed')">
Completed
</button>

<button onclick="status(${a.id},'Cancelled')">
Cancelled
</button>

</div>

</div>

`).join("")

:

'<p class="small">No appointments yet.</p>'

}

</section>

`;

}

function status(id,s){

let a=data.appointments.find(x=>x.id===id);

if(a){

a.status=s;

save();

appointments();

}

}

function customers(){

screen.innerHTML=`

<section class="card">

<h2>Customers</h2>

<p class="small">
Customer profiles and service history.
</p>

</section>

<section class="card">

${
data.customers.length

?

data.customers.map(c=>`

<div class="item">

<b>${esc(c.name)}</b>

<p class="small">
${esc(c.phone)}
</p>

<p class="small">
${esc(c.address)}
</p>

<b>Vehicles</b>

${
(c.vehicles||[]).map(v=>
`<p class="small">${esc(v.year)} ${esc(v.make)} ${esc(v.model)}</p>`
).join("")
}

<b>History</b>

${
(c.history||[]).map(h=>
`<p class="small">${esc(h.date)} • ${esc(h.service)} • ${esc(h.status)}</p>`
).join("")
}

<button class="primary"
onclick="start()">
Book Next
</button>

</div>

`).join("")

:

'<p class="small">No customers yet.</p>'

}

</section>

`;

}

function moneyPage(){

let income=data.payments.reduce((a,x)=>a+Number(x.amount),0);

let expenses=data.expenses.reduce((a,x)=>a+Number(x.amount),0);

screen.innerHTML=`

<section class="card">

<h2>Money</h2>

<p class="small">
Track payments, expenses and profit.
</p>

</section>

<section class="metricgrid">

<div class="metric">
<span class="small">Income</span>
<strong>${money(income)}</strong>
</div>

<div class="metric">
<span class="small">Expenses</span>
<strong>${money(expenses)}</strong>
</div>

<div class="metric">
<span class="small">Profit</span>
<strong>${money(income-expenses)}</strong>
</div>

<div class="metric">
<span class="small">Paid Jobs</span>
<strong>${data.payments.length}</strong>
</div>

</section>

<section class="card">

<div class="actions">

<button class="primary"
onclick="payment()">
+ Payment
</button>

<button onclick="expense()">
+ Expense
</button>

</div>

</section>

`;

}

function payment(){

let x=prompt("Payment amount:");

if(!x||isNaN(x))return;

data.payments.push({
amount:Number(x),
date:new Date().toISOString().slice(0,10)
});

save();

moneyPage();

}

function expense(){

let x=prompt("Expense amount:");

if(!x||isNaN(x))return;

data.expenses.push({
amount:Number(x),
date:new Date().toISOString().slice(0,10)
});

save();

moneyPage();

}

function more(){

screen.innerHTML=`

<section class="card">

<h2>More</h2>

<p class="small">
Business information and settings.
</p>

</section>

<section class="card">

<div class="row">
<span>Business</span>
<b>Silkey's Mobile Oil</b>
</div>

<div class="row">
<span>Phone</span>
<b>580-222-6601</b>
</div>

<div class="row">
<span>Cash App</span>
<b>$KyleSilkey</b>
</div>

<div class="row">
<span>Payment</span>
<b>Cash • Check • Cash App</b>
</div>

</section>

<section class="card">

<h3>Schedule</h3>

<p class="small">
Sunday: all day<br>
Monday–Thursday: 5–9 PM<br>
Friday/Saturday: closed
</p>

</section>

<section class="card">

<p class="small">
Vehicle Specs and external API lookup have been removed.
</p>

</section>

`;

}

home();

</script>

</body>
</html>
