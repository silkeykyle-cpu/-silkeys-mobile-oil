<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Silkey's Mobile Oil</title>
<style>
:root{--bg:#0b0d10;--card:#15191e;--text:#f5f7fa;--muted:#aeb7c2;--line:#2b323a;--accent:#ef4b23}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:18px}
header{text-align:center;padding:12px 0 20px}.brand{font-size:27px;font-weight:800}.tag,.small{color:var(--muted);font-size:13px}
nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}button,.btn{border:1px solid var(--line);background:var(--card);color:var(--text);padding:12px 15px;border-radius:10px;cursor:pointer}nav button.active,.primary{background:var(--accent);border-color:var(--accent);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px;margin-bottom:14px}.hero{text-align:center;padding:28px 20px}.hero h1{font-size:32px;margin:4px 0 10px}.hero p{color:var(--muted);line-height:1.5}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-bottom:11px}.field label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:12px;background:#0e1216;color:var(--text);border:1px solid var(--line);border-radius:9px}.field textarea{min-height:90px}.full{grid-column:1/-1}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.price{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}.item{padding:13px 0;border-bottom:1px solid var(--line)}.row{display:flex;gap:10px;align-items:center}.status{font-size:12px;padding:5px 8px;border-radius:999px;background:#293039}.money{font-size:26px;font-weight:800}
@media(max-width:560px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head>
<body><div class="wrap">
<header><div class="brand">Silkey's Mobile Oil</div><div class="tag">Oil Change. We Come To You.</div><div class="small">Muskogee, Oklahoma & surrounding areas • 580-222-6601</div></header>
<nav><button class="active" onclick="show('home',this)">Home</button><button onclick="show('customer',this)">Book</button><button onclick="show('owner',this)">Owner</button></nav>
<main id="app"></main></div>
<script>
const K='silkeysNewAppData';let D=JSON.parse(localStorage.getItem(K)||'{"appointments":[],"customers":[],"payments":[]}');
const $=id=>document.getElementById(id), save=()=>localStorage.setItem(K,JSON.stringify(D)), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function show(p,b){document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');$('app').innerHTML=p==='home'?home():p==='customer'?booking():owner()}
function home(){return `<section class="card hero"><h1>Oil Change. We Come To You.</h1><p>Mobile oil-change service at your home, work, or another convenient location.</p><div class="actions" style="justify-content:center"><button class="primary" onclick="show('customer')">Book My Oil Change</button><a class="btn" href="tel:5802226601">Call 580-222-6601</a></div></section><section class="card"><h2>Service Area</h2><p class="small">Muskogee, Fort Gibson, Wagoner, Warner, Braggs, Okay, Oktaha, Taft, Haskell, Webbers Falls, Porter and surrounding areas.</p></section><section class="card"><h2>Pricing</h2>${prices()}</section>`}
function prices(){return `<div class="price"><span>Conventional — up to 5 qt</span><b>$105</b></div><div class="price"><span>Full Synthetic ⭐ — up to 5 qt</span><b>$120</b></div><div class="price"><span>Truck/SUV Full Synthetic — up to 6 qt</span><b>$140</b></div><div class="price"><span>Large Truck/SUV — up to 8 qt</span><b>$150+</b></div><div class="price"><span>Diesel</span><b>$175+</b></div><div class="price"><span>Additional oil</span><b>$10/qt</b></div>`}
function booking(){return `<section class="card"><h2>Book My Oil Change</h2><form id="f"><div class="grid"><div class="field"><label>Name</label><input id="n" required></div><div class="field"><label>Phone</label><input id="p" type="tel" required></div><div class="field full"><label>Service address</label><input id="a" required></div><div class="field"><label>Date</label><input id="d" type="date" required></div><div class="field"><label>Time</label><select id="t" required><option value="">Choose</option><option>5:00 PM</option><option>6:00 PM</option><option>7:00 PM</option><option>8:00 PM</option><option>9:00 PM</option><option>Sunday — call/text</option></select></div><div class="field"><label>Vehicle year</label><input id="y" required></div><div class="field"><label>Make</label><input id="mk" required></div><div class="field"><label>Model</label><input id="mo" required></div><div class="field full"><label>Service</label><select id="s" required><option value="">Choose a service</option><option>Conventional — $105</option><option>Full Synthetic — $120</option><option>Truck/SUV Full Synthetic — $140</option><option>Large Truck/SUV — $150+</option><option>Diesel — $175+</option></select></div><div class="field full"><label>Notes</label><textarea id="notes"></textarea></div></div><p class="small">Payment: Cash, Check, or Cash App ($KyleSilkey).</p><div class="actions"><button class="primary">Submit Booking</button></div></form></section>`}
function owner(){return `<section class="card"><h2>Owner Dashboard</h2><div class="grid"><div class="card"><div class="small">Appointments</div><div class="money">${D.appointments.length}</div></div><div class="card"><div class="small">Scheduled</div><div class="money">${D.appointments.filter(x=>x.status==='Scheduled').length}</div></div></div></section><section class="card"><h3>Owner Navigation</h3><div class="actions"><button class="primary" onclick="ownerTab('appointments')">Appointments</button><button onclick="ownerTab('customers')">Customers</button><button onclick="ownerTab('money')">Money</button><button onclick="ownerTab('more')">More</button></div></section><div id="oc">${appointments()}</div>`}
function appointments(){return `<section class="card"><h3>Appointments</h3>${D.appointments.length?D.appointments.map((x,i)=>`<div class="item"><div class="row"><b>${esc(x.name)}</b><span class="status">${esc(x.status)}</span></div><div class="small">${esc(x.date)} • ${esc(x.time)} • ${esc(x.phone)}</div><div class="small">${esc(x.vehicle)} • ${esc(x.service)}</div><div class="small">${esc(x.address)}</div><div class="actions"><button onclick="st(${i},'On the Way')">On the Way</button><button onclick="st(${i},'Working')">Working</button><button onclick="st(${i},'Completed')">Completed</button><button onclick="st(${i},'Cancelled')">Cancelled</button></div></div>`).join(''):'<div class="small">No appointments yet.</div>'}</section>`}
function ownerTab(x){let o=$('oc');if(x==='appointments')o.innerHTML=appointments();if(x==='customers')o.innerHTML='<section class="card"><h3>Customers</h3>'+ (D.customers.map(c=>`<div class="item"><b>${esc(c.name)}</b><div class="small">${esc(c.phone)} • ${esc(c.address)}</div></div>`).join('')||'<div class="small">No customers yet.</div>')+'</section>';if(x==='money')o.innerHTML='<section class="card"><h3>Money</h3><div class="money">$'+D.payments.reduce((a,x)=>a+Number(x.amount||0),0).toFixed(2)+'</div><div class="actions"><button class="primary" onclick="pay()">Record Payment</button></div></section>';if(x==='more')o.innerHTML='<section class="card"><h3>More</h3><p class="small">Silkey\'s Mobile Oil<br>580-222-6601<br>Cash App: $KyleSilkey</p><p class="small">Sunday all day; Monday–Thursday 5–9 PM. Friday/Saturday closed.</p></section>'}
function st(i,x){D.appointments[i].status=x;save();ownerTab('appointments')}function pay(){let x=prompt('Payment amount');if(x&&Number(x)>0){D.payments.push({amount:Number(x)});save();ownerTab('money')}}
document.addEventListener('submit',e=>{if(e.target.id!=='f')return;e.preventDefault();let x={id:Date.now(),name:n.value,phone:p.value,address:a.value,date:d.value,time:t.value,vehicle:y.value+' '+mk.value+' '+mo.value,service:s.value,notes:notes.value,status:'Scheduled'};D.appointments.push(x);let c=D.customers.find(c=>c.phone===x.phone);if(c){c.name=x.name;c.address=x.address}else D.customers.push({name:x.name,phone:x.phone,address:x.address});save();$('app').innerHTML='<section class="card"><h2>Booking Received</h2><p>Thanks, '+esc(x.name)+'. Your request has been saved.</p><p><b>'+esc(x.date)+' • '+esc(x.time)+'</b><br>'+esc(x.vehicle)+'<br>'+esc(x.service)+'</p><button class="primary" onclick="show(\'home\')">Back Home</button></section>'});
show('home');
</script></body></html>
